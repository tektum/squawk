name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tektum/verity-images
          ref: feat/squawk-platform-predicates
          path: verity-images-squawk
      - run: mv verity-images-squawk ../verity-images-squawk
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: "0.17.5"
          enable-cache: "true"
      - run: devbox run install
      - run: devbox run -- bun run verify:p0
      - run: devbox run -- bun run wrangler deploy --dry-run --outdir .tmp/worker-build --env=""
      - run: devbox run -- bash -c 'actionlint .github/workflows/*.yml && shellcheck matcher/build.sh scripts/rollback-monitor.sh'
      - run: devbox run -- bash -c 'bun run audit:security && bun run verify:e2e && bun run test:verifier && bun run audit:scope'
      - run: devbox run -- bash -c '! grep -R -E "BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY|ghp_[A-Za-z0-9]|github_pat_" --exclude-dir=node_modules --exclude-dir=.git .'
