name: Deploy Squawk

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        default: staging
        type: choice
        options: [staging, production]

jobs:
  deploy-dark:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: "0.17.5"
          enable-cache: "true"
      - run: devbox run install
      - run: devbox run check
      - name: Build Worker bundle
        run: devbox run -- bun run wrangler deploy --dry-run --outdir .tmp/worker-build --env=""
      - name: Provision D1
        run: devbox run -- bash -c 'tofu -chdir=infra init -backend=false && tofu -chdir=infra apply -auto-approve -target=cloudflare_d1_database.squawk'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_worker_bundle_path: ../.tmp/worker-build/index.js
          TF_VAR_descope_issuer: ${{ vars.DESCOPE_ISSUER }}
          TF_VAR_descope_discovery_url: ${{ vars.DESCOPE_DISCOVERY_URL }}
          TF_VAR_descope_audience: ${{ vars.DESCOPE_AUDIENCE }}
          TF_VAR_descope_project_id: ${{ secrets.DESCOPE_PROJECT_ID }}
          TF_VAR_descope_tenant_id: ${{ secrets.DESCOPE_TENANT_ID }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
      - name: Apply D1 migrations
        run: devbox run -- bun run wrangler d1 migrations apply "squawk-${ENVIRONMENT}" --remote
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Apply Worker infrastructure dark
        run: devbox run -- tofu -chdir=infra apply -auto-approve
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          TF_VAR_cloudflare_account_id: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_environment: ${{ inputs.environment }}
          TF_VAR_worker_bundle_path: ../.tmp/worker-build/index.js
          TF_VAR_descope_issuer: ${{ vars.DESCOPE_ISSUER }}
          TF_VAR_descope_discovery_url: ${{ vars.DESCOPE_DISCOVERY_URL }}
          TF_VAR_descope_audience: ${{ vars.DESCOPE_AUDIENCE }}
          TF_VAR_descope_project_id: ${{ secrets.DESCOPE_PROJECT_ID }}
          TF_VAR_descope_tenant_id: ${{ secrets.DESCOPE_TENANT_ID }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
      - name: Inject GitHub App and webhook secrets
        run: |
          devbox run -- bun run wrangler secret put GH_APP_ID --name "squawk-${ENVIRONMENT}" <<<"$GH_APP_ID"
          devbox run -- bun run wrangler secret put GH_APP_INSTALLATION_ID --name "squawk-${ENVIRONMENT}" <<<"$GH_APP_INSTALLATION_ID"
          devbox run -- bun run wrangler secret put GH_APP_PRIVATE_KEY --name "squawk-${ENVIRONMENT}" <<<"$GH_APP_PRIVATE_KEY"
          devbox run -- bun run wrangler secret put GH_WEBHOOK_SECRET --name "squawk-${ENVIRONMENT}" <<<"$GH_WEBHOOK_SECRET"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENVIRONMENT: ${{ inputs.environment }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
