name: Backfill verity-images

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backfill-verity-images

jobs:
  backfill:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: "0.17.5"
          enable-cache: "true"
      - run: devbox run install
      - run: devbox run -- bun run build:matcher
      - name: Build Worker bundle
        run: devbox run -- bun run wrangler deploy --dry-run --outdir .tmp/worker-build --env=""
      - name: Deploy pull request Worker to staging
        run: |
          devbox run -- tofu -chdir=infra init -input=false -backend-config="key=squawk/staging.tfstate"
          devbox run -- tofu -chdir=infra apply -auto-approve
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DESCOPE_MANAGEMENT_KEY: ${{ secrets.DESCOPE_MANAGEMENT_KEY }}
          TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          TF_VAR_descope_audience: ${{ vars.DESCOPE_AUDIENCE }}
          TF_VAR_descope_discovery_url: ${{ vars.DESCOPE_DISCOVERY_URL }}
          TF_VAR_descope_issuer: ${{ vars.DESCOPE_ISSUER }}
          TF_VAR_descope_project_id: ${{ secrets.DESCOPE_PROJECT_ID }}
          TF_VAR_descope_tenant_id: ${{ secrets.DESCOPE_TENANT_ID }}
          TF_VAR_environment: staging
          TF_VAR_worker_bundle_path: ../.tmp/worker-build/index.js
      - name: Refresh staging Worker secrets
        run: |
          devbox run -- bun run wrangler secret put GH_APP_ID --name squawk-staging <<<"$GH_APP_ID"
          devbox run -- bun run wrangler secret put GH_APP_INSTALLATION_ID --name squawk-staging <<<"$GH_APP_INSTALLATION_ID"
          devbox run -- bun run wrangler secret put GH_APP_PRIVATE_KEY --name squawk-staging <<<"$GH_APP_PRIVATE_KEY"
          devbox run -- bun run wrangler secret put GH_WEBHOOK_SECRET --name squawk-staging <<<"$GH_WEBHOOK_SECRET"
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_APP_ID: ${{ secrets.SQUAWK_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.SQUAWK_APP_PEM }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
      - name: Replay historical registry package events
        env:
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
        run: devbox run -- bun scripts/backfill-verity-images.ts --apply
