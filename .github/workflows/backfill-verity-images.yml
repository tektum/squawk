name: Backfill verity-images

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: backfill-verity-images

jobs:
  backfill:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jetify-com/devbox-install-action@8c6a66ed6273138b1915457069de78cb52fe3bd7 # v0.15.0
        with:
          devbox-version: "0.17.5"
          enable-cache: "true"
      - run: devbox run install
      - run: devbox run -- bun run build:matcher
      - name: Deploy pull request Worker to staging
        run: |
          devbox run -- tofu -chdir=infra init -input=false -backend-config="key=squawk/staging.tfstate"
          database_id=$(devbox run -- tofu -chdir=infra output -raw d1_database_id)
          jq --arg id "$database_id" \
            'del(.env,.vars) | .name="squawk-staging" | .d1_databases[0].database_name="squawk-staging" | .d1_databases[0].database_id=$id' \
            wrangler.jsonc > wrangler.deploy.json
          jq -n \
            --arg app_id "$GH_APP_ID" \
            --arg installation_id "$GH_APP_INSTALLATION_ID" \
            --arg private_key "$GH_APP_PRIVATE_KEY" \
            --arg webhook_secret "$GH_WEBHOOK_SECRET" \
            '{GH_APP_ID:$app_id,GH_APP_INSTALLATION_ID:$installation_id,GH_APP_PRIVATE_KEY:$private_key,GH_WEBHOOK_SECRET:$webhook_secret}' |
            devbox run -- bun run wrangler deploy --config wrangler.deploy.json --keep-vars --secrets-file /dev/stdin
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TF_STATE_ACCESS_KEY_ID }}
          AWS_ENDPOINT_URL_S3: https://${{ vars.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TF_STATE_SECRET_ACCESS_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_APP_ID: ${{ secrets.SQUAWK_APP_ID }}
          GH_APP_INSTALLATION_ID: ${{ vars.GH_APP_INSTALLATION_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.SQUAWK_APP_PEM }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
      - name: Replay historical registry package events
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GH_WEBHOOK_SECRET: ${{ secrets.GH_WEBHOOK_SECRET }}
        run: |
          log=$(mktemp)
          devbox run -- bun run wrangler tail squawk-staging --format json >"$log" 2>&1 &
          tail_pid=$!
          trap 'kill "$tail_pid" 2>/dev/null || true; wait "$tail_pid" 2>/dev/null || true; cat "$log"; rm -f "$log"' EXIT
          sleep 3
          devbox run -- bun scripts/backfill-verity-images.ts --apply
